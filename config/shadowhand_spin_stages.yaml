      controller: {"follow_pen": true, "active_distance": 0.0, "control_wrist": false, "coupling": 1.0, "max_reference_error": 0.8, "reference_margin": 0.35}
      windows: {"pulse_start": 150, "pulse_stop": 180, "pulse_speed": 0.03, "record_stop": 190, "jacobian_steps": [152, 156, 160, 164, 168, 172, 176], "jacobian_min_displacement": 0.0002}
    frozen_sha256: "7219ec6d5075b4457a6642cb0199de17fdd9bea423a95b0eb17d20d885ede250"
