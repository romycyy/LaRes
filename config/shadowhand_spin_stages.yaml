task_name: "ShadowHandSpin"
isaaclab_root: "/home/ubuntu/IsaacLab"
device: "cuda:0"

pipeline_task: "Isaac-ShadowHandSpin-Stage3-Direct-v0"

log_dir: "./logs/shadowhand_spin"
num_envs: 1
max_steps: 32

dataset_episodes: 4
scripted_noise: 0.05

bc_steps: 20
bc_batch_size: 32
bc_lr: 0.01

rl_iterations: 2
rl_episodes_per_iter: 2
rl_lr: 0.003

eval_episodes: 2

record_stage_gifs: true
gif_dir: "gifs"
gif_fps: 20
gif_max_steps: 32
gif_deterministic: true

# Research protocols (`--research-protocol <name>`); the smoke stages above ignore this block.
research_protocols:
  # R-038: any-hit versus sustained episode success on identical trajectories (diagnostic controllers).
  episode_rule_audit:
    log_dir: "logs/pen_spin/r038_episode_rule_audit"
    cases_per_stage: 10
    pool_seeds: {1: 4000, 2: 4001, 3: 4002}
    manifests:
      1: "config/manifests/pen_spin_stage1_probe_s4000.yaml"
      2: "config/manifests/pen_spin_stage2_probe_s4001.yaml"
      3: "config/manifests/pen_spin_stage3_probe_s4002.yaml"
  # R-039: frozen feedback gait (scripted_expert.FROZEN_R039) vs the frozen R-038 oscillator; D-034 reducer.
  scripted_expert_qualification:
    log_dir: "logs/pen_spin/r039_scripted_expert"
    cases_per_stage: 40        # screen 0-9, promotion 10-39
    pool_seeds: {1: 4010, 2: 4011, 3: 4012}
    control_seed: 4098         # debug-only: reproducibility control batches
    manifests:
      1: "config/manifests/pen_spin_stage1_development_s4010.yaml"
      2: "config/manifests/pen_spin_stage2_development_s4011.yaml"
      3: "config/manifests/pen_spin_stage3_development_s4012.yaml"
    baseline: "open_loop_digit_oscillation"
    candidate: "feedback_gait"
    controllers: ["open_loop_digit_oscillation", "feedback_gait"]
  # R-040: one PPO expert trained on Stage 3 (predicates nest), scored on all stages vs the frozen R-039 gait.
  ppo_expert:
    log_dir: "logs/pen_spin/r040_ppo_expert"
    training_seed: 4020
    max_transitions: 1080000000
    num_steps_per_env: 16      # ShadowHandSpinPPORunnerCfg
    gate_env_counts: [2048, 4096, 8192]
    gate_iterations: 20
    debug_seed: 4097           # checkpoint diagnostics and the reproducibility gate only
    debug_cases: 40
    promotion_cases: 30
    promotion_seeds: {1: 4030, 2: 4031, 3: 4032}
    manifests:
      1: "config/manifests/pen_spin_stage1_promotion_s4030.yaml"
      2: "config/manifests/pen_spin_stage2_promotion_s4031.yaml"
      3: "config/manifests/pen_spin_stage3_promotion_s4032.yaml"
  # R-041: does the qualified expert need feedback? Closed-loop D-036 expert vs a clock-only replay of one
  # of its sustained-success action sequences, Stage 3, one process per rollout.
  #   python scripts/run_shadowhand_spin_stages.py --config config/shadowhand_spin_stages.yaml --study feedback_ablation
  feedback_ablation:
    log_dir: "logs/pen_spin/r041_feedback_ablation"
    checkpoint: "logs/pen_spin/r040_ppo_expert/train/model_8239.pt"
    checkpoint_sha256: "f81be523a51cc5bb8bd095d5ed208ba8dd227a37ca05d5dc78283a24d89985d7"
    training_seed: 4020
    cases: 40
    pool_seeds: {demo: 4100, diagnostic: 4101}
    demonstration_manifest: "config/manifests/pen_spin_stage3_demo_s4100.yaml"
    diagnostic_manifest: "config/manifests/pen_spin_stage3_diagnostic_s4101.yaml"
  # R-044 (approved 2026-10-27, advisor call_00091): observation-clamping lesions of the D-036 expert, 160 episodes.
  #   python scripts/run_shadowhand_spin_stages.py --config config/shadowhand_spin_stages.yaml --study feedback_lesions
  feedback_lesions:
    log_dir: "logs/pen_spin/r044_feedback_lesions"
    checkpoint: "logs/pen_spin/r040_ppo_expert/train/model_8239.pt"
    checkpoint_sha256: "f81be523a51cc5bb8bd095d5ed208ba8dd227a37ca05d5dc78283a24d89985d7"
    training_seed: 4020
    cases: 40
    pool_seed: 4140
    manifest: "config/manifests/pen_spin_stage3_lesion_s4140.yaml"
  # R-047 (approved 2026-10-27, advisor call_00098): four-step observation-delay lesions of the D-036 expert, 160
  # episodes. Same expert, sustained reducer (D-034), paired analysis and reproducibility gate as R-044. A delayed group
  # beside live ones is a temporal joint-distribution shift; the result characterizes this checkpoint only.
  #   python scripts/run_shadowhand_spin_stages.py --config config/shadowhand_spin_stages.yaml --study feedback_delay
  #     --manifest-seed 4200 --output-dir logs/pen_spin_feedback_delay_s4200
  feedback_delay:
    log_dir: "logs/pen_spin_feedback_delay_s4200"
    checkpoint: "logs/pen_spin/r040_ppo_expert/train/model_8239.pt"
    checkpoint_sha256: "f81be523a51cc5bb8bd095d5ed208ba8dd227a37ca05d5dc78283a24d89985d7"
    training_seed: 4020
    cases: 40
    pool_seed: 4200
    delay_steps: 4
    manifest: "config/manifests/pen_spin_stage3_feedback_delay_development_s4200.yaml"
  # R-051 (approved 2026-10-27, advisor call_00107): expert takeover from learner-visited states, 96 episodes, no LLM.
  # Branches by closed-loop re-execution in fresh processes (donor, learner_repeat, takeover); Gate 1 = repeat
  # bit-identical to the donor, Gate 2 = takeover observations equal the donor's through each branch step.
  #   python scripts/run_shadowhand_spin_stages.py --config config/shadowhand_spin_stages.yaml --study learner_recovery
  #     --manifest-seed 4310 --output-dir logs/pen_spin_learner_recovery_s4310
  learner_recovery:
    log_dir: "logs/pen_spin_learner_recovery_s4310"
    checkpoint: "logs/pen_spin/r040_ppo_expert/train/model_8239.pt"
    checkpoint_sha256: "f81be523a51cc5bb8bd095d5ed208ba8dd227a37ca05d5dc78283a24d89985d7"
    training_seed: 4020
    cases: 32
    pool_seed: 4310
    manifest: "config/manifests/pen_spin_stage3_recovery_audit_s4310.yaml"
    learner:  # R-046 block 3 promoted prefix candidate gen0_cand0 (10/30 on its promotion set)
      source: "config/pen_spin/r046_block3_incumbent/policy_source.py"
      source_sha256: "40782dcdf5a95589d0b34062919728fa92d4e5760fce890e3bd98833285e602d"
      state: "config/pen_spin/r046_block3_incumbent/state.pt"
      state_sha256: "c61ecd5142a45c25311a80592d5e29a5edc540bde87248efa30d7771c0380f22"
      fixed_action_scale: 0.1
  # R-053 (approved 2026-10-27, advisor call_00110): sign reversal of the learner's observed axial angular velocity,
  # 96 episodes, no LLM. Same frozen learner as R-051; identity-wrapper repeat must be bit-identical (gate).
  #   python scripts/run_shadowhand_spin_stages.py --config config/shadowhand_spin_stages.yaml --study learner_axial_sign
  #     --manifest-seed 4400 --output-dir logs/pen_spin_learner_axial_sign_s4400
  learner_axial_sign:
    log_dir: "logs/pen_spin_learner_axial_sign_s4400"
    cases: 32
    pool_seed: 4400
    manifest: "config/manifests/pen_spin_stage3_learner_axial_sign_development_s4400.yaml"
    learner:  # the R-051 learner: R-046 block 3 promoted prefix candidate gen0_cand0
      source: "config/pen_spin/r046_block3_incumbent/policy_source.py"
      source_sha256: "40782dcdf5a95589d0b34062919728fa92d4e5760fce890e3bd98833285e602d"
      state: "config/pen_spin/r046_block3_incumbent/state.pt"
      state_sha256: "c61ecd5142a45c25311a80592d5e29a5edc540bde87248efa30d7771c0380f22"
      fixed_action_scale: 0.1
  # R-058 (approved 2026-11-04, advisor call_00117): budget-matched CMA-ES vs random search on the frozen R-046
  # learner's twelve spin and centering scalars, 8 blocks x (2 arms x 8 generations x 8 candidates x 10 screen cases
  # + 10 parent screen + 3 x 30 promotion + 3 x 40 fresh) = 12,000 episodes, no LLM. Both arms screen each generation
  # in one fresh process of 80 environments; the random arm is a fresh pycma instance per generation, asked once,
  # never told. Winners frozen before promotion; fresh cases confirm only.
  #   python scripts/run_shadowhand_spin_stages.py --config config/shadowhand_spin_stages.yaml
  #     --study r058_scalar_cma_vs_random --log-dir logs/pen_spin/r058_scalar_cma_vs_random
  r058_scalar_cma_vs_random:
    log_dir: "logs/pen_spin/r058_scalar_cma_vs_random"
    cases: 80
    roles: {screen: [0, 10], promotion: [10, 40], fresh: [40, 80]}
    seeds: [4510, 4511, 4512, 4513, 4514, 4515, 4516, 4517]
    manifest_pattern: "config/manifests/pen_spin_stage3_r058_block_s{seed}.yaml"
    learner:  # the R-051/R-053/R-054 learner: R-046 block 3 promoted prefix candidate gen0_cand0
      source: "config/pen_spin/r046_block3_incumbent/policy_source.py"
      source_sha256: "40782dcdf5a95589d0b34062919728fa92d4e5760fce890e3bd98833285e602d"
      state: "config/pen_spin/r046_block3_incumbent/state.pt"
      state_sha256: "c61ecd5142a45c25311a80592d5e29a5edc540bde87248efa30d7771c0380f22"
      fixed_action_scale: 0.1
    whitelist:  # bounds are the parent's own declared get_param_ranges; everything else stays frozen
      spin: [stroke_amp, lift_amp, spin_target, speed_gain, phase_lead, stance_sharpness]
      centering: [center_gain, center_length, safe_radius, position_sharpness, tilt_gain, swing_damping]
    optimizer:  # pycma; x0 = parent in bound-normalised coordinates
      library: pycma
      sigma0: 0.2
      popsize: 8
      generations: 8
      bounds: [0.0, 1.0]
      random_seed_base: 100   # random arm generation g of block seed s: pycma seed = 100 + 100 s + g + 1
    ranking: "sustained successes desc, drops asc, mean tail-hit fraction desc, candidate index asc"
  # R-060 (approved 2026-11-04, advisor call_00121): re-rank the R-058 archive's top 8 per arm on 40 new rescreen cases
  # per block (new seed s' re-ranks R-058 block 4510 + (s' - 4550)); re-ranked winners, original winners and the parent
  # on 30 promotion + 40 fresh cases each, one process per controller per manifest. 8 x 1030 = 8240 episodes, no LLM.
  #   python scripts/run_shadowhand_spin_stages.py --config config/shadowhand_spin_stages.yaml
  #     --study r060_archive_rescreen --log-dir logs/pen_spin/r060_archive_rescreen
  r060_archive_rescreen:
    log_dir: "logs/pen_spin/r060_archive_rescreen"
    cases: 110
    roles: {rescreen: [0, 40], promotion: [40, 70], fresh: [70, 110]}
    seeds: [4550, 4551, 4552, 4553, 4554, 4555, 4556, 4557]
    manifest_pattern: "config/manifests/pen_spin_stage3_r060_block_s{seed}.yaml"
    disjoint_from:
      - "config/manifests/pen_spin_stage3_r058_block_s4510.yaml"
      - "config/manifests/pen_spin_stage3_r058_block_s4511.yaml"
      - "config/manifests/pen_spin_stage3_r058_block_s4512.yaml"
      - "config/manifests/pen_spin_stage3_r058_block_s4513.yaml"
      - "config/manifests/pen_spin_stage3_r058_block_s4514.yaml"
      - "config/manifests/pen_spin_stage3_r058_block_s4515.yaml"
      - "config/manifests/pen_spin_stage3_r058_block_s4516.yaml"
      - "config/manifests/pen_spin_stage3_r058_block_s4517.yaml"
    archive:  # the R-058 run (D-048): 8 generations x 8 candidates per arm per block, parameters and screen metrics
      log_dir: "logs/pen_spin/r058_scalar_cma_vs_random"
      block_seed_base: 4510
      generations: 8
      popsize: 8
    shortlist: 8                        # each arm's original top 8 by the frozen R-058 ranking
    rescreen_candidates_per_process: 8  # 8 x 40 = 320 environments per rescreen process, identical for both arms
    learner:  # as R-058
      source: "config/pen_spin/r046_block3_incumbent/policy_source.py"
      source_sha256: "40782dcdf5a95589d0b34062919728fa92d4e5760fce890e3bd98833285e602d"
      state: "config/pen_spin/r046_block3_incumbent/state.pt"
      state_sha256: "c61ecd5142a45c25311a80592d5e29a5edc540bde87248efa30d7771c0380f22"
      fixed_action_scale: 0.1
    whitelist:  # as R-058 (bounds = the parent's declared ranges)
      spin: [stroke_amp, lift_amp, spin_target, speed_gain, phase_lead, stance_sharpness]
      centering: [center_gain, center_length, safe_radius, position_sharpness, tilt_gain, swing_damping]
  # R-062 (approved 2026-11-04, advisor call_00125): does the R-046 learner spin through its periodic stroke? Source
  # substitution + rolling * gait -> + 0.0 * rolling * gait (zero cycle mean), identity factor 1.0 as the gate, one
  # 80-case diagnostic manifest (seed 4560), three processes, 240 episodes, no LLM.
  #   python scripts/run_shadowhand_spin_stages.py --config config/shadowhand_spin_stages.yaml
  #     --study r062_stroke_lesion --log-dir logs/pen_spin/r062_stroke_lesion
  r062_stroke_lesion:
    log_dir: "logs/pen_spin/r062_stroke_lesion"
    cases: 80
    pool_seed: 4560
    manifest: "config/manifests/pen_spin_stage3_r062_diagnostic_s4560.yaml"
    learner:  # as R-058 / R-060
      source: "config/pen_spin/r046_block3_incumbent/policy_source.py"
      source_sha256: "40782dcdf5a95589d0b34062919728fa92d4e5760fce890e3bd98833285e602d"
      state: "config/pen_spin/r046_block3_incumbent/state.pt"
      state_sha256: "c61ecd5142a45c25311a80592d5e29a5edc540bde87248efa30d7771c0380f22"
      fixed_action_scale: 0.1
