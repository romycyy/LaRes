                  request_scale: 0.05, max_request_speed: 0.05}
        controller: {cap: 0.30, control_wrist: false, coupling: 1.0}
      settings:
        - {controller: {cap: 0.15}}
        - {}
        - {decoder: {damping: 0.001}, controller: {cap: 0.15}}
        - {decoder: {damping: 0.001}}
        - {decoder: {damping: 0.01}}
    # Frozen 2026-11-21 from calibration setting cal2 (seed 4740; 10 cells = 800 episodes), after S1 and before any
    # residual cell on seed 4741. No setting met bound activity <= 0.20 and feasible/requested >= 0.70 (bound activity
