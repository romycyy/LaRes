# ============================================================
#  debug_spec.md Stage D — live two-generation smoke test
#
#  Development partition only. Run, then check every item in DEBUG_PROGRESS.md:
#    MUJOCO_GL=egl .venv-metaworld/bin/python scripts/run_full_evolution.py \
#        --config config/debug_smoke_two_generation.yaml
#    .venv-metaworld/bin/python scripts/summarise_experiments.py \
#        --log-dir logs/debug_smoke_two_generation
# ============================================================

env_name: "push-v2"        # canonical id; MetaWorld 3 registers it as push-v3
seed: 42
use_mt1: true

manifest_dir: "./config/manifests"
eval_max_steps: 150

dataset_episodes: 150
# Collected by `lock_baseline.py --collect-demos 150` on the train manifest, with episode ids,
# so the validation split is by episode.
demo_buffer_path: "./logs/baseline_lock/demo_push-v2.pkl"

bc_steps: 2000
rl_iterations: 0
rl_episodes: 30

objective: deterministic_mse
fixed_action_scale: 0.1
checkpoint_steps: [0, 500, 1000, 1500, 2000]
rollout_checkpoint_probes: 4
probe_episodes: 10            # development tail, disjoint from the 30-case screen/expanded head
max_repair_per_candidate: 1
max_llm_calls_per_generation: 30
param_budget: [6, 10]

screen_episodes: 10
expanded_episodes: 30
eval_episodes: 30

model: "gpt-5"
policy_gen_two_phase: true
policy_impl_mode: per_idea
num_generations: 2
pop_size: 3
elite_num: 2

log_dir: "./logs/debug_smoke_two_generation"
record_demo_gif: false
