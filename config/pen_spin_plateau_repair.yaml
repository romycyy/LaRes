# ---------- R-046: plateau-triggered gait-scaffold continuation (approved call_00091; wrappers call_00094) ----------
#  python scripts/run_full_evolution.py --config config/pen_spin_plateau_repair.yaml --study gait_preserving_repair
#  Per block seed: one 94-case manifest split into roles (lares/envs/isaac_pen_spin/gait_repair.py ROLES); a cold prefix
#  (the R-042 prefix, plain 157-d schema), then unchanged_gait, bounded_residual (|delta| <= 0.15) and whole_edit
#  (unbounded delta) on the 177-d gait-scaffold schema. The gait is FROZEN_R039, pinned by its parameter hash.
gait_preserving_repair:
  study_dir: "logs/pen_spin/r046_gait_scaffold"
  # Blocks moved from 4180-4183 to fresh 4190-4193 with the v2 gate (call_00095); 4180-4183 stay recorded, never used.
  block_seeds: [4190, 4191, 4192, 4193]
  parity_seed: 4184
  parity_cases: 40
  parity_gate_version: 2          # v1 failed (one late flip); v2: identical through step 150, <= 4/40 diverged
  parity_match_through_step: 150
  parity_max_diverged: 4
  residual_bound: 0.15
  gait_sha256: "97e4065f61960eaf064c8d6a4533522c809fbe6c1b335f7a9ba8b556992b1cac"
  gait_protocol_config: "config/shadowhand_spin_stages.yaml"   # R-039's evaluator, parity only

# R-048 (approved 2026-10-27, advisor call_00098): expert local-sensitivity evidence vs raw expert labels for a
# bounded gait residual, ungated, six blocks; lares/envs/isaac_pen_spin/local_feedback.py.
#   python scripts/run_full_evolution.py --config config/pen_spin_plateau_repair.yaml --study local_feedback_evidence
#     --block-seeds 4210,4211,4212,4213,4214,4215 --output-dir logs/pen_spin_local_feedback_evidence
local_feedback_evidence:
  study_dir: "logs/pen_spin_local_feedback_evidence"
  block_seeds: [4210, 4211, 4212, 4213, 4214, 4215]   # one 80-case manifest each: screen, promotion, probe, fresh
  residual_bound: 0.15
  gait_sha256: "97e4065f61960eaf064c8d6a4533522c809fbe6c1b335f7a9ba8b556992b1cac"
  max_calls_per_slot: 2           # one call plus at most one linked correction; two slots per arm
  # Step sizes: 10% of each coordinate's 5-95 percentile range over these 12 expert episodes (R-046 block 1).
  demo_trace: "logs/pen_spin/r046_gait_scaffold/block1/expert/expert_0001.trace.npz"
  demo_trace_sha256: "4915844983d1c5d9a8a1b21fc7a3d7ded4e8ea159820850fe7e0efca7eb345e3"

