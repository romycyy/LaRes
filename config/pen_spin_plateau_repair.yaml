  max_output_tokens: 32000
  max_input_chars: 48000            # about 16,000 tokens at most
  llm_workers: 16
  # the one immutable paragraph of prior findings every proposer prompt carries (the grammar cannot read it)
  prior_findings: >-
    Measured on a trained version of the template module (success about 0.73-0.79 of episodes): of ALL episodes,
    about 7.8% fail without the module ever firing (mostly the pen is dropped before step 60); about 7.2% fire and
    roll again but are not rolling steadily (above 4 rad/s, centred) when the blend and the 60 boost steps have
    ended, and mostly finish persistently slow; about 3.2% fire and never roll again (a third of them drop the pen
    late); about 1.6% roll steadily at the end of the blend or boost and lose it within 30 steps. An earlier study
    found that a second attempt added nothing over simply training the single attempt longer, and that small fixed
    joint offsets during the first 60 steps added nothing. Performance falls sharply when the pen starts from a wider
    range of reset poses. Without any module the root controller succeeds in about 0.55 of episodes and about 41% of
    episodes roll persistently slowly (about 2 rad/s).

log_dir: "logs/pen_spin/r042_keyframe_repair"
record_demo_gif: false

