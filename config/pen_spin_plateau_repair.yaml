  smoke_aa_tolerance: 0.03          # the probe rollout's equal-slot check; ORIGINALLY also the four-identical-slot gate (failed at 0.045)
  # Amendment (2026-11-23, advisor consult call_00310, decision delegated by the user; after the smoke, before any
  # generation, training or confirmation; no new simulation): four identical template slots on the same 512 placements
  # scored 0.574 / 0.584 / 0.563 / 0.539 (max pairwise difference 0.045 > 0.03) with a mean pairwise case discordance
  # of 0.137, i.e. one pairwise difference has sd sqrt(0.137 / 512) = 0.0166. The fixed 0.03 was the implementer's own
  # tolerance, mis-set from smokes of controllers without a discrete re-capture. The gate is now the noise-scaled
  # max pairwise difference <= smoke_aa_sd_multiplier * sqrt(mean discordance / cases) (0.065 here), an engineering
